name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      # Robustezza al fuso orario (CONTESTO §3): la stessa suite in tre fusi diversi
      - run: TZ=Europe/Rome npm test
      - run: TZ=America/Los_Angeles npm test
      - run: TZ=Pacific/Auckland npm test
