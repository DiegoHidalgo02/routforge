name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Gate unico (INV-11): typecheck + lint + formato + test, identico a locale e hook Stop
      - run: npm run verify
      # Robustezza al fuso orario (CONTESTO §3, D-TIME-1): la stessa suite in quattro fusi diversi dal runner,
      # incluso uno a mezz'ora (Kolkata) e uno che attraversa il cambio d'ora in direzione opposta (Auckland)
      - run: TZ=Europe/Rome npm test
      - run: TZ=America/Los_Angeles npm test
      - run: TZ=Asia/Kolkata npm test
      - run: TZ=Pacific/Auckland npm test
