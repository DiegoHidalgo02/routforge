<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0D13;color:#fff;--font-ui:'Manrope',system-ui,sans-serif;--font-num:'IBM Plex Mono',ui-monospace,monospace;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:#fff;text-decoration:none}a:hover{color:#6E96F2}
</style>
</helmet>
<div data-screen-label="Sessione (mobile)" style="width:390px;height:844px;background:#141820;border:1px solid #292E37;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-sizing:border-box">
  <div style="height:16px;flex:none"></div>
  <div style="position:absolute;left:0;right:0;top:16px;bottom:0"><dc-import name="S15 Sessione Panel" view="{{ view }}" exit="{{ exit }}" tab="{{ tab }}" timer-state="{{ timerState }}" source="{{ source }}" mode="{{ mode }}" hyper="{{ hyper }}" hint-size="100%,100%"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;setup&quot;,&quot;options&quot;:[&quot;setup&quot;,&quot;timer&quot;,&quot;iperfocus&quot;,&quot;debrief&quot;,&quot;done&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stato iniziale&quot;},&quot;tab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;material&quot;,&quot;options&quot;:[&quot;material&quot;,&quot;ai&quot;,&quot;notes&quot;],&quot;tsType&quot;:&quot;'material' | 'ai' | 'notes'&quot;,&quot;section&quot;:&quot;Stato iniziale&quot;},&quot;timerState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;running&quot;,&quot;options&quot;:[&quot;running&quot;,&quot;paused&quot;,&quot;overrun&quot;,&quot;unverified&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stato iniziale&quot;},&quot;source&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;routine&quot;,&quot;options&quot;:[&quot;routine&quot;,&quot;free&quot;,&quot;recovery&quot;,&quot;nocourse&quot;],&quot;tsType&quot;:&quot;'routine' | 'free' | 'recovery' | 'nocourse'&quot;,&quot;section&quot;:&quot;Stato iniziale&quot;},&quot;exit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;no&quot;,&quot;options&quot;:[&quot;no&quot;,&quot;tentativo&quot;,&quot;registrata&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Iperfocus (SCENARI D5)&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;continuous&quot;,&quot;options&quot;:[&quot;continuous&quot;,&quot;p25&quot;,&quot;p50&quot;,&quot;p90&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Setup&quot;},&quot;hyper&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Setup&quot;}}">
class Component extends DCLogic {
  // Prototipo: i parametri dell'indirizzo (?view=…) valgono come prop quando la tavola non le passa
  pp() { const o = {}; Object.keys(this.props).forEach(k => { const v = this.props[k]; if (v !== undefined && v !== null && v !== '') o[k] = v; }); try { new URLSearchParams(window.location.search).forEach((v, k) => { o[k] = v; }); } catch (_) {} return o; }
  renderVals() {
    const pp = this.pp(); return { view: pp.view || 'setup', exit: pp.exit || 'no', tab: pp.tab || 'material', timerState: pp.timerState || 'running', source: pp.source || 'routine', mode: pp.mode || 'continuous', hyper: pp.hyper === true || pp.hyper === 'true' }; }
}
</script>
</body>
</html>
