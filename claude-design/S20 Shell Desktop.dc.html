<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0D13;color:#fff;--font-ui:'Manrope',system-ui,sans-serif;--font-num:'IBM Plex Mono',ui-monospace,monospace;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:#fff;text-decoration:none}a:hover{color:#6E96F2}
::-webkit-scrollbar{display:none}
</style>
</helmet>
<div data-screen-label="Statistiche · Notifiche · Impostazioni (desktop)" style="width:1280px;height:800px;background:#0A0D13;border:1px solid #292E37;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:240px minmax(0,1fr);box-sizing:border-box">
  <aside style="background:#141820;border-right:1px solid #292E37;padding:20px 16px;display:flex;flex-direction:column;gap:2px;min-height:0">
    <div style="display:flex;align-items:center;gap:10px;padding:2px 10px 18px"><span style="width:30px;height:30px;border-radius:9px;background:#6E96F2;display:flex;align-items:center;justify-content:center;gap:3px"><span style="width:3px;height:9px;border-radius:2px;background:#fff"></span><span style="width:3px;height:16px;border-radius:2px;background:#fff"></span><span style="width:3px;height:12px;border-radius:2px;background:#fff"></span></span><span style="font:700 16px var(--font-ui);letter-spacing:-.01em">RoutForge</span></div>
    <a href="#" style="display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:10px;color:#959CA8;font:500 14px var(--font-ui)" style-hover="background:#1E232C;color:#fff"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" style="stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>Oggi</a>
    <a href="#" style="display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:10px;background:{{ statsBg }};color:{{ statsColor }};font:{{ statsWeight }} 14px var(--font-ui)" style-hover="background:#1E232C;color:#fff"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" style="stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="M3 3v18h18"></path><path d="M18 17V9M13 17V5M8 17v-3"></path></svg>Statistiche</a>
    <a href="#" style="display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:10px;color:#959CA8;font:500 14px var(--font-ui)" style-hover="background:#1E232C;color:#fff"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" style="stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>Cerca<span style="margin-left:auto;font:500 11px var(--font-num);color:#636975">⌘K</span></a>
    <button style="margin-top:10px;height:40px;border-radius:10px;background:#6E96F2;color:#0A0D13;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 1px rgba(0,0,0,.35),0 6px 16px -8px rgba(0,0,0,.6);font:600 14px var(--font-ui);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer" style-hover="background:#8AAAF6"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" style="stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12h14M12 5v14"></path></svg>Crea</button>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px">
      <a href="#" style="display:flex;align-items:center;gap:10px;height:48px;padding:0 8px;border-radius:10px;color:#fff" style-hover="background:#1E232C"><span style="width:30px;height:30px;flex:none;border-radius:999px;background:#1E232C;border:1px solid #292E37;display:grid;place-items:center;font:600 12px var(--font-ui);color:#959CA8;box-sizing:border-box">A</span><span style="display:flex;flex-direction:column;min-width:0"><span style="font:600 13px/16px var(--font-ui)">Alex</span><span style="display:flex;align-items:center;gap:6px;font:11px/14px var(--font-ui);color:#959CA8"><span style="width:6px;height:6px;border-radius:999px;background:#22C55E"></span>Sincronizzato · <span style="font:500 11px var(--font-num)">2</span> min</span></span></a>
      <a href="#" style="display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:10px;background:{{ setBg }};color:{{ setColor }};font:{{ setWeight }} 14px var(--font-ui)" style-hover="background:#1E232C;color:#fff"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" style="stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>Impostazioni</a>
    </div>
  </aside>
  <sc-if value="{{ isSettings }}" hint-placeholder-val="{{ false }}">
    <div style="display:grid;grid-template-columns:280px minmax(0,1fr);min-height:0">
      <section style="border-right:1px solid #292E37;padding:20px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto;scrollbar-width:none">
        <span style="font:600 20px/24px var(--font-ui);letter-spacing:-.01em;padding:0 10px 14px">Impostazioni</span>
        <sc-for list="{{ settingsNav }}" as="n" hint-placeholder-count="6"><a href="#" style="display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:10px;background:{{ n.bg }};color:{{ n.color }};font:{{ n.weight }} 14px var(--font-ui)" style-hover="background:#1E232C;color:#fff"><span style="flex:1">{{ n.label }}</span><span style="font:500 11px var(--font-num);color:#636975">{{ n.meta }}</span></a></sc-for>
      </section>
      <section style="min-height:0;overflow:auto;scrollbar-width:none;padding:24px 32px 32px"><div style="max-width:640px"><dc-import name="S22 Impostazioni Panel" view="{{ view }}" wide="{{ true }}" hint-size="100%,600px"></dc-import></div></section>
    </div>
  </sc-if>
  <sc-if value="{{ notSettings }}" hint-placeholder-val="{{ true }}">
    <section style="min-height:0;overflow:auto;scrollbar-width:none;padding:24px 32px 32px;display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;align-items:center;gap:12px;max-width:{{ maxW }}"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="display:flex;align-items:center;gap:10px;min-width:0;font:600 22px/26px var(--font-ui);letter-spacing:-.01em"><span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ title }}</span><sc-if value="{{ hasCount }}" hint-placeholder-val="{{ false }}"><span style="flex:none;height:22px;min-width:22px;padding:0 7px;border-radius:999px;background:#1C2439;color:#6E96F2;font:600 12px/22px var(--font-num);text-align:center">{{ count }}</span></sc-if></span><sc-if value="{{ hasSubtitle }}" hint-placeholder-val="{{ true }}"><span style="font:12px/16px var(--font-ui);color:#959CA8">{{ subtitle }}</span></sc-if></div><sc-if value="{{ isNotif }}" hint-placeholder-val="{{ false }}"><button style="height:36px;padding:0 12px;border-radius:10px;background:#1E232C;border:1px solid #292E37;color:#fff;font:600 13px var(--font-ui);cursor:pointer" style-hover="background:#292E37">Segna tutte lette</button></sc-if></div>
      <div style="max-width:{{ maxW }}">
        <sc-if value="{{ isStats }}" hint-placeholder-val="{{ true }}"><dc-import name="S20 Statistiche Panel" tab="{{ tab }}" wide="{{ true }}" hint-size="100%,600px"></dc-import></sc-if>
        <sc-if value="{{ isNotif }}" hint-placeholder-val="{{ false }}"><dc-import name="S21 Notifiche Panel" view="{{ view }}" hint-size="100%,600px"></dc-import></sc-if>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;stats&quot;,&quot;options&quot;:[&quot;stats&quot;,&quot;notif&quot;,&quot;settings&quot;],&quot;tsType&quot;:&quot;'stats' | 'notif' | 'settings'&quot;,&quot;section&quot;:&quot;Schermata&quot;},&quot;tab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;overview&quot;,&quot;options&quot;:[&quot;overview&quot;,&quot;behaviors&quot;,&quot;study&quot;,&quot;practice&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Statistiche&quot;},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;list&quot;,&quot;options&quot;:[&quot;list&quot;,&quot;empty&quot;,&quot;root&quot;,&quot;notifications&quot;,&quot;account&quot;,&quot;account-conflict&quot;,&quot;login&quot;,&quot;login-code&quot;,&quot;ai&quot;,&quot;ai-nokey&quot;,&quot;backup&quot;,&quot;diagnostics&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Notifiche / Impostazioni&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const sc = this.props.screen || 'stats', view = this.props.view || 'list', tab = this.props.tab || 'overview';
    const isStats = sc === 'stats', isNotif = sc === 'notif', isSettings = sc === 'settings';
    const act = on => ({ bg: on ? '#1C2439' : 'transparent', color: on ? '#6E96F2' : '#959CA8', weight: on ? 600 : 500 });
    const a = act(isStats), b = act(isNotif), c = act(isSettings);
    const sv = view === 'list' ? 'root' : view;
    const settingsNav = [['root', 'Generale', ''], ['notifications', 'Notifiche', ''], ['account', 'Account e sincronizzazione', 'in pari'], ['ai', 'Modello e chiave AI', 'Gemini'], ['backup', 'Backup e dati', '10,9 MB'], ['diagnostics', 'Diagnostica', ''], ['about', 'Informazioni', 'v0.9']].map(([id, label, meta]) => { const on = id === sv.split('-')[0]; return { label, meta, bg: on ? '#1E232C' : 'transparent', color: on ? '#fff' : '#959CA8', weight: on ? 600 : 500 }; });
    return { isStats, isNotif, isSettings, notSettings: !isSettings, tab, view: sv, settingsNav, maxW: isStats ? '980px' : '640px', hasBadge: !(isNotif && view === 'empty'),
      title: isStats ? 'Statistiche' : 'Notifiche', hasSubtitle: false, hasCount: isNotif && view !== 'empty', count: '3', subtitle: isStats ? 'Ultimi 90 giorni · confronto con i 90 prima' : (view === 'empty' ? 'Nessun esito da registrare' : '3 esiti da registrare · da Impostazioni'),
      statsBg: a.bg, statsColor: a.color, statsWeight: a.weight, notifBg: b.bg, notifColor: b.color, notifWeight: b.weight, setBg: c.bg, setColor: c.color, setWeight: c.weight };
  }
}
</script>
</body>
</html>
