<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0D13;color:#fff;--font-ui:'Manrope',system-ui,sans-serif;--font-num:'IBM Plex Mono',ui-monospace,monospace;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:#fff;text-decoration:none}a:hover{color:#6E96F2}
</style>
</helmet>
<div data-screen-label="PDF · Mese · Widget (mobile)" style="width:390px;height:844px;background:{{ bg }};border:1px solid #292E37;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-sizing:border-box">
  <div style="height:16px;flex:none"></div>
  <div style="position:absolute;left:0;right:0;top:16px;bottom:0"><dc-import name="S13 Extra Panel" view="{{ view }}" hint-size="100%,100%"></dc-import></div>
  <sc-if value="{{ isMonth }}" hint-placeholder-val="{{ false }}">
  <nav style="position:absolute;left:50%;transform:translateX(-50%);width:264px;bottom:25px;height:56px;border-radius:999px;background:linear-gradient(180deg,#1A1F29,#111520);border:1px solid #2E343E;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 4px rgba(0,0,0,.4),0 14px 34px -6px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.6);display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;z-index:4;box-sizing:border-box">
    <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;font:500 10px/12px var(--font-ui)" style-hover="color:#fff"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" style="stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>Oggi</a>
    <button aria-label="Crea" style="width:44px;height:44px;border-radius:999px;background:#6E96F2;border:0;color:#0A0D13;display:grid;place-items:center;margin:0 auto;cursor:pointer;padding:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 1px rgba(0,0,0,.35),0 6px 16px -8px rgba(0,0,0,.6)" style-hover="background:#8AAAF6"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" style="stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12h14M12 5v14"></path></svg></button>
    <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:5px;color:#959CA8;font:500 10px/12px var(--font-ui)" style-hover="color:#fff"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" style="stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="M3 3v18h18"></path><path d="M18 17V9M13 17V5M8 17v-3"></path></svg>Statistiche</a>
  </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;pdf&quot;,&quot;options&quot;:[&quot;pdf&quot;,&quot;pdf-scan&quot;,&quot;month&quot;,&quot;widget&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stato iniziale&quot;}}">
class Component extends DCLogic {
  renderVals() { const v = this.props.view || 'pdf'; return { view: v, isMonth: v === 'month', bg: v === 'month' ? '#0A0D13' : '#141820' }; }
}
</script>
</body>
</html>
