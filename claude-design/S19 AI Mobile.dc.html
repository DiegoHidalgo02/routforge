<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0D13;color:#fff;--font-ui:'Manrope',system-ui,sans-serif;--font-num:'IBM Plex Mono',ui-monospace,monospace;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:#fff;text-decoration:none}a:hover{color:#6E96F2}
</style>
</helmet>
<div data-screen-label="Flashcard · Quiz · Chat (mobile)" style="width:390px;height:844px;background:#141820;border:1px solid #292E37;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-sizing:border-box">
  <div style="height:16px;flex:none"></div>
  <div style="position:absolute;left:0;right:0;top:16px;bottom:0"><dc-import name="S19 AI Panel" view="{{ view }}" hint-size="100%,100%"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;flashcard-front&quot;,&quot;options&quot;:[&quot;flashcard-front&quot;,&quot;flashcard-back&quot;,&quot;quiz&quot;,&quot;quiz-answered&quot;,&quot;quiz-done&quot;,&quot;devswipe&quot;,&quot;devswipe-wrong&quot;,&quot;devswipe-done&quot;,&quot;bughunter&quot;,&quot;bughunter-solved&quot;,&quot;bughunter-done&quot;,&quot;trivia&quot;,&quot;trivia-explain&quot;,&quot;trivia-done&quot;,&quot;chat&quot;,&quot;chat-global&quot;,&quot;chat-nokey&quot;,&quot;chat-offline&quot;,&quot;chat-error&quot;,&quot;chat-history&quot;,&quot;chat-history-vuota&quot;,&quot;flashcard-done&quot;,&quot;chat-error-key&quot;,&quot;chat-error-model&quot;,&quot;chat-error-safety&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stato iniziale&quot;}}">
class Component extends DCLogic {
  renderVals() { return { view: this.props.view || 'flashcard-front' }; }
}
</script>
</body>
</html>
