<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0D13;color:#fff;--font-ui:'Manrope',system-ui,sans-serif;--font-num:'IBM Plex Mono',ui-monospace,monospace;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:#fff;text-decoration:none}a:hover{color:#8AAAF6}
</style>
</helmet>
<section data-screen-label="Impostazioni · notifiche, AI, account, backup, diagnostica" style="padding:40px;display:flex;flex-direction:column;gap:24px">
  <header style="display:flex;flex-direction:column;gap:8px;max-width:820px">
    <span style="font:600 11px/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:#959CA8">RoutForge · FUNZIONALITA §23 · §7.7 · §16 · §20 · §21 · §24</span>

  </header>
  <div style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · root</figcaption><dc-import name="S20 Shell Mobile" screen="settings" view="root" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · Notifiche</figcaption><dc-import name="S20 Shell Mobile" screen="settings" view="notifications" hint-size="390px,844px"></dc-import></figure>

    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Panel · Backup · conferma Elimina tutti i dati (§23, MECC §22)</figcaption><div style="width:390px;box-sizing:border-box;padding:16px;background:#0A0D13;border:1px solid #292E37;border-radius:24px"><dc-import name="S22 Impostazioni Panel" view="backup-erase" hint-size="100%,1100px"></dc-import></div></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:1280px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Desktop · Notifiche</figcaption><dc-import name="S20 Shell Desktop" screen="settings" view="notifications" hint-size="1280px,800px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:1280px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Desktop · Account e sincronizzazione</figcaption><dc-import name="S20 Shell Desktop" screen="settings" view="account" hint-size="1280px,800px"></dc-import></figure>
