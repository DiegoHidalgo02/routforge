<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0D13;color:#fff;--font-ui:'Manrope',system-ui,sans-serif;--font-num:'IBM Plex Mono',ui-monospace,monospace;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:#fff;text-decoration:none}a:hover{color:#8AAAF6}
</style>
</helmet>
<div data-screen-label="S4 Crea (mobile)" style="width:390px;height:844px;position:relative;border-radius:44px;overflow:hidden;background:#0A0D13"><dc-import name="S1 Oggi Mobile" intro="{{ false }}" view="{{ view }}" crea="{{ crea }}" hint-size="390px,844px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;type&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;todo&quot;,&quot;options&quot;:[&quot;todo&quot;,&quot;study&quot;,&quot;routine&quot;,&quot;event&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stato&quot;},&quot;filled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Stato&quot;},&quot;reminder&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;auto&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;off&quot;,&quot;custom&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stato&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;create&quot;,&quot;options&quot;:[&quot;create&quot;,&quot;edit&quot;],&quot;tsType&quot;:&quot;'create' | 'edit'&quot;,&quot;section&quot;:&quot;Stato&quot;},&quot;due&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;week&quot;,&quot;options&quot;:[&quot;today&quot;,&quot;week&quot;,&quot;month&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stato&quot;},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;giorno&quot;,&quot;options&quot;:[&quot;giorno&quot;,&quot;settimana&quot;,&quot;mese&quot;],&quot;tsType&quot;:&quot;'giorno' | 'settimana' | 'mese'&quot;,&quot;section&quot;:&quot;Vista sotto il foglio&quot;}}">
class Component extends DCLogic {
  // Il foglio Crea vive dentro Oggi (S1): qui si sceglie solo con che cosa si apre. I parametri dell'indirizzo valgono come prop (prototipo).
  pp() { const o = {}; Object.keys(this.props).forEach(k => { const v = this.props[k]; if (v !== undefined && v !== null && v !== '') o[k] = v; }); try { new URLSearchParams(window.location.search).forEach((v, k) => { o[k] = v; }); } catch (_) {} return o; }
  renderVals() {
    const pp = this.pp();
    return { view: pp.view || 'giorno', crea: { type: pp.type || 'todo', filled: pp.filled !== false && pp.filled !== 'false', reminder: pp.reminder || 'auto', due: pp.due, mode: pp.mode || 'create' } };
  }
}
</script>
</body>
</html>
