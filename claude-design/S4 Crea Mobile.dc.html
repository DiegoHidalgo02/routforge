<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0D13;color:#fff;--font-ui:'Manrope',system-ui,sans-serif;--font-num:'IBM Plex Mono',ui-monospace,monospace;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:#fff;text-decoration:none}a:hover{color:#6E96F2}
</style>
</helmet>
<div data-screen-label="S4 Crea (mobile)" style="width:390px;height:844px;position:relative;border-radius:44px;overflow:hidden;background:#0A0D13">
  <div style="position:absolute;inset:0;isolation:isolate;z-index:0"><dc-import name="S1 Oggi Mobile" variant="default" hint-size="390px,844px"></dc-import></div>
  <div style="position:absolute;inset:0;background:rgba(10,13,19,.72);border-radius:44px;z-index:1"></div>
  <div style="position:absolute;left:0;right:0;top:56px;bottom:0;z-index:2;background:#141820;border:1px solid #292E37;border-bottom:0;border-radius:24px 24px 44px 44px;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box">
    <div style="width:36px;height:4px;border-radius:999px;background:#292E37;margin:8px auto 0;flex:none"></div>
    <div style="flex:1;min-height:0;position:relative;margin-bottom:20px">
      <dc-import name="S4 Crea Panel" type="{{ type }}" filled="{{ filled }}" reminder="{{ reminder }}" due="{{ due }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;type&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;todo&quot;,&quot;options&quot;:[&quot;todo&quot;,&quot;study&quot;,&quot;routine&quot;,&quot;event&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stato&quot;},&quot;filled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Stato&quot;},&quot;reminder&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;auto&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;off&quot;,&quot;custom&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stato&quot;}}">
class Component extends DCLogic {
  renderVals() { return { type: this.props.type || 'todo', filled: this.props.filled !== false && this.props.filled !== 'false', reminder: this.props.reminder || 'auto', due: this.props.due }; }
}
</script>
</body>
</html>
