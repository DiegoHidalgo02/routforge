<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0D13;color:#fff;--font-ui:'Manrope',system-ui,sans-serif;--font-num:'IBM Plex Mono',ui-monospace,monospace;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:#fff;text-decoration:none}a:hover{color:#8AAAF6}
::-webkit-scrollbar{display:none}
@keyframes rf-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rf-bell{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div data-screen-label="S8 Sveglia a schermo intero" style="width:390px;height:844px;background:#0A0D13;border:1px solid #292E37;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-sizing:border-box">
  <span style="position:absolute;left:0;right:0;top:0;height:3px;background:{{ fill }}"></span>
  <div style="flex:none;padding:28px 24px 0;display:flex;align-items:center;gap:8px">
    <span style="display:inline-flex;align-items:center;gap:6px;font:600 10px/12px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:{{ ink }}">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" style="stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;animation:rf-bell 1.8s ease-in-out infinite"><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path></svg>
      Sveglia
    </span>
    <span style="margin-left:auto;font:500 12px var(--font-num);color:#636975">{{ trigger }}</span>
  </div>
  <div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:0 24px;animation:rf-in .18s ease-out">
    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font:600 56px/60px var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.03em">{{ clock }}</span>
      <span style="font:500 13px/18px var(--font-ui);color:#959CA8">{{ today }}</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="height:20px;padding:0 7px;border-radius:999px;background:{{ soft }};color:{{ ink }};font:600 10px/1 var(--font-ui);letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;align-self:flex-start">{{ type }}</span>
      <span style="font:600 22px/28px var(--font-ui);letter-spacing:-.01em;text-wrap:pretty">{{ title }}</span>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span style="display:flex;align-items:center;gap:8px;font:500 13px/18px var(--font-ui);color:#959CA8">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" style="stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <span style="font:500 13px var(--font-num)">{{ range }}</span>
        </span>
        <sc-if value="{{ hasContext }}" hint-placeholder-val="{{ true }}">
          <span style="display:flex;align-items:center;gap:8px;font:500 13px/18px var(--font-ui);color:{{ ink }}">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" style="stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
            {{ context }}
          </span>
        </sc-if>
      </div>
    </div>
  </div>
  <div style="flex:none;padding:0 24px 32px;display:flex;flex-direction:column;gap:8px">
    <button style="height:44px;border-radius:12px;background:#6E96F2;color:#0A0D13;border:0;font:600 15px var(--font-ui);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 1px rgba(0,0,0,.35),0 6px 16px -8px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;gap:8px" style-hover="background:#8AAAF6" style-active="transform:scale(.985);background:#5A82DE">{{ primaryIcon }}{{ primary }}</button>
    <sc-if value="{{ hasSnooze }}" hint-placeholder-val="{{ true }}">
      <button style="height:44px;border-radius:12px;background:#1E232C;color:#fff;border:1px solid #292E37;font:600 15px var(--font-ui);cursor:pointer" style-hover="background:#292E37">Posticipa <span style="font:500 14px var(--font-num);color:#959CA8">+10 min</span></button>
    </sc-if>
    <button style="height:44px;border-radius:12px;background:transparent;color:#959CA8;border:0;font:600 15px var(--font-ui);cursor:pointer" style-hover="background:#1E232C;color:#fff">Chiudi</button>
    <span style="font:12px/16px var(--font-ui);color:#636975;text-align:center;padding-top:2px">{{ note }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;studio&quot;,&quot;options&quot;:[&quot;studio&quot;,&quot;todo&quot;,&quot;routine&quot;,&quot;esito&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Tipo di sveglia (MECCANISMI §13.2)&quot;}}">
class Component extends DCLogic {
  T = {
    studio: { type: 'Studio', fill: '#9B6CFA', ink: '#B794FD', soft: '#2A1F45' },
    todo: { type: 'Todo', fill: '#14B8A6', ink: '#2DD4BF', soft: '#16302E' },
    routine: { type: 'Routine', fill: '#FACC15', ink: '#FACC15', soft: '#34311E' },
    esito: { type: 'Studio', fill: '#9B6CFA', ink: '#B794FD', soft: '#2A1F45' }
  };
  icon(d, w = 18) {
    return React.createElement('svg', { viewBox: '0 0 24 24', width: w, height: w, fill: 'none', stroke: 'currentColor', style: { strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', flex: 'none' } }, d.split('|').map((p, i) => React.createElement('path', { key: i, d: p })));
  }
  renderVals() {
    const kind = this.props.kind || 'studio';
    const t = this.T[kind] || this.T.studio;
    const D = {
      studio: {
        title: 'Ripasso Modulo 0', range: '16:00 – 16:45', context: 'Syllabus Software Engineer 2026 · Unità 0.7',
        primary: 'Inizia', primaryIcon: this.icon('M6 3l14 9-14 9z'), trigger: '5 min prima', note: 'Posticipa sposta di 10 minuti, nel rispetto delle ore silenziose.'
      },
      todo: {
        title: 'Leggere 20 pagine', range: '19:00 – 19:45', context: 'Deep Work · checklist 2/5',
        primary: 'Segna fatto', primaryIcon: this.icon('M20 6 9 17l-5-5'), trigger: '30 min prima', note: 'Posticipa sposta di 10 minuti, nel rispetto delle ore silenziose.'
      },
      routine: {
        title: 'Palestra', range: '14:30 – 15:40', context: '',
        primary: 'Apri il blocco', primaryIcon: this.icon('M5 12h14M12 5l7 7-7 7'), trigger: '10 min prima', note: 'Le routine si segnano Fatta o Saltata dal blocco.'
      },
      esito: {
        title: 'Registra l\u2019esito della sessione', range: '16:00 – 16:45', context: 'Ripasso Modulo 0 · Unità 0.7',
        primary: 'Registra esito', primaryIcon: this.icon('M9 11l3 3 8-8|M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11'), trigger: '10 min dopo la fine', note: 'Senza esito la sessione resta parziale nelle statistiche.'
      }
    }[kind] || {};
    return {
      ...t, ...D,
      clock: kind === 'todo' ? '18:30' : kind === 'esito' ? '16:55' : kind === 'routine' ? '14:20' : '15:55',
      today: 'Mercoledì 15 maggio',
      hasContext: !!D.context,
      hasSnooze: kind !== 'esito'
    };
  }
}
</script>
</body>
</html>
