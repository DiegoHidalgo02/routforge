<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0D13;color:#fff;--font-ui:'Manrope',system-ui,sans-serif;--font-num:'IBM Plex Mono',ui-monospace,monospace;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:#fff;text-decoration:none}a:hover{color:#6E96F2}
</style>
</helmet>
<div data-screen-label="Flashcard · Quiz · Chat (desktop)" style="width:1280px;height:800px;background:#0A0D13;border:1px solid #292E37;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:240px minmax(0,1fr);box-sizing:border-box">
  <aside style="background:#141820;border-right:1px solid #292E37;padding:20px 16px;display:flex;flex-direction:column;gap:2px;min-height:0">
    <div style="display:flex;align-items:center;gap:10px;padding:2px 10px 18px"><span style="width:30px;height:30px;border-radius:9px;background:#6E96F2;display:flex;align-items:center;justify-content:center;gap:3px"><span style="width:3px;height:9px;border-radius:2px;background:#fff"></span><span style="width:3px;height:16px;border-radius:2px;background:#fff"></span><span style="width:3px;height:12px;border-radius:2px;background:#fff"></span></span><span style="font:700 16px var(--font-ui);letter-spacing:-.01em">RoutForge</span></div>
    <a href="#" style="display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:10px;color:#959CA8;font:500 14px var(--font-ui)" style-hover="background:#1E232C;color:#fff"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" style="stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="M3 3v18h18"></path><path d="M18 17V9M13 17V5M8 17v-3"></path></svg>Statistiche</a>
    <a href="#" style="display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:10px;color:#959CA8;font:500 14px var(--font-ui)" style-hover="background:#1E232C;color:#fff"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" style="stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>Cerca<span style="margin-left:auto;font:500 11px var(--font-num);color:#636975">⌘K</span></a>
    <button style="margin-top:10px;height:40px;border-radius:10px;background:#6E96F2;color:#0A0D13;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 1px rgba(0,0,0,.35),0 6px 16px -8px rgba(0,0,0,.6);font:600 14px var(--font-ui);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer" style-hover="background:#8AAAF6"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" style="stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12h14M12 5v14"></path></svg>Crea</button>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px">
      <a href="#" style="display:flex;align-items:center;gap:10px;height:48px;padding:0 8px;border-radius:10px;color:#fff" style-hover="background:#1E232C"><span style="width:30px;height:30px;flex:none;border-radius:999px;background:#1E232C;border:1px solid #292E37;display:grid;place-items:center;font:600 12px var(--font-ui);color:#959CA8;box-sizing:border-box">A</span><span style="display:flex;flex-direction:column;min-width:0"><span style="font:600 13px/16px var(--font-ui)">Alex</span><span style="display:flex;align-items:center;gap:6px;font:11px/14px var(--font-ui);color:#959CA8"><span style="width:6px;height:6px;border-radius:999px;background:#22C55E"></span>Sincronizzato · <span style="font:500 11px var(--font-num)">2</span> min</span></span></a>
      <a href="#" style="display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:10px;color:#959CA8;font:500 14px var(--font-ui)" style-hover="background:#1E232C;color:#fff"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" style="stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>Impostazioni</a>
    </div>
  </aside>
  <section style="position:relative;min-height:0;min-width:0;display:flex;justify-content:center;padding:24px 40px;box-sizing:border-box">
    <div style="position:relative;width:100%;max-width:{{ maxW }};border:1px solid #292E37;border-radius:16px;overflow:hidden"><dc-import name="S19 AI Panel" view="{{ view }}" hint-size="100%,100%"></dc-import></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;chat&quot;,&quot;options&quot;:[&quot;flashcard-front&quot;,&quot;flashcard-back&quot;,&quot;quiz&quot;,&quot;quiz-answered&quot;,&quot;quiz-done&quot;,&quot;devswipe&quot;,&quot;devswipe-wrong&quot;,&quot;devswipe-done&quot;,&quot;bughunter&quot;,&quot;bughunter-solved&quot;,&quot;bughunter-done&quot;,&quot;trivia&quot;,&quot;trivia-explain&quot;,&quot;trivia-done&quot;,&quot;chat&quot;,&quot;chat-global&quot;,&quot;chat-nokey&quot;,&quot;chat-offline&quot;,&quot;chat-error&quot;,&quot;chat-history&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stato iniziale&quot;}}">
class Component extends DCLogic {
  renderVals() { const v = this.props.view || 'chat'; return { view: v, maxW: v.startsWith('chat') ? '840px' : '640px' }; }
}
</script>
</body>
</html>
