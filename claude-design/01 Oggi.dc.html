<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0D13;color:#fff;--font-ui:'Manrope',system-ui,sans-serif;--font-num:'IBM Plex Mono',ui-monospace,monospace;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:#fff;text-decoration:none}a:hover{color:#8AAAF6}

</helmet>
<section data-screen-label="Oggi · calendario Giorno" style="padding:40px;display:flex;flex-direction:column;gap:24px">
  <header style="display:flex;flex-direction:column;gap:8px;max-width:820px">
    <span style="font:600 11px/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:#959CA8">RoutForge · FUNZIONALITA §2 · Oggi: Giorno, Settimana, Mese · card Adesso (MECCANISMI §14) · trascinamento (MECCANISMI §15)</span>
    <h1 style="margin:0;font:600 28px/1.2 var(--font-ui)">Oggi · Giorno, Settimana, Mese</h1>
  </header>
  <div style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8;text-wrap:pretty">Mobile · giornata · card Adesso (hero, scatto dell’ora) · il cerchio spunta: la card atterra sul mazzo, il progresso si aggiorna, «Annulla» per 5 s</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · archivio completate aperto</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" archive="open" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · card Adesso · da recuperare</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" now="recupera" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · card Adesso · tra poco</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" now="mancanti" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8;text-wrap:pretty">Mobile · card Adesso · todo con orario: cerchio 28, voci aperte → «Voci rimaste»</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" now-kind="todo" strike-delay="{{ 0 }}" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8;text-wrap:pretty">Mobile · card Adesso · routine con fasi: il cerchio apre «Revisione fasi»</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" now-kind="routine" strike-delay="{{ 0 }}" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8;text-wrap:pretty">Mobile · card Adesso · evento: il cerchio è «Completa evento»</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" now-kind="event" strike-delay="{{ 0 }}" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8;text-wrap:pretty">Mobile · card Adesso · routine da recuperare (todo ed evento passati non diventano hero)</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" now-kind="routine" now="recupera" strike-delay="{{ 0 }}" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8;text-wrap:pretty">Mobile · Giornata chiusa · card di pagina sotto le completate</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" variant="done" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · sessione in corso (banner)</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" session="{{ true }}" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · ritorno dopo assenza</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" absence="{{ true }}" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · menu account (Corsi · Notifiche · Impostazioni)</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" menu="{{ true }}" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · vista Settimana</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" view="settimana" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · settimana libera</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" view="settimana-vuota" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · vista Mese</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" view="mese" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · trascinamento · riordino dei todo senza orario</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" drag="lift" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8;text-wrap:pretty">Mobile · riordino senza trascinamento (WCAG 2.5.7): tocco sulla maniglia, «Sposta su» · «Sposta giù» nella stessa priorità</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" move="attivo" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8;text-wrap:pretty">Mobile · cerchio su un todo con voci aperte: «Voci rimaste» sopra Oggi (FUNZIONALITA §6)</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" sheet="voci" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8;text-wrap:pretty">Mobile · cerchio su una routine con fasi: «Revisione fasi» sopra Oggi</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" now-kind="routine" sheet="fasi" strike-delay="{{ 0 }}" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8;text-wrap:pretty">Mobile · cerchio su una sessione di studio: «Registra esito» sopra Oggi (senza sessione conta la durata pianificata)</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" now="passato" sheet="esito" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:1280px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Desktop · sidebar 240 + giornata</figcaption><dc-import name="S1 Oggi Desktop" hint-size="1280px,800px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:1280px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Desktop · vista Settimana</figcaption><dc-import name="S1 Oggi Desktop" view="settimana" hint-size="1280px,800px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:1280px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Desktop · settimana libera</figcaption><dc-import name="S1 Oggi Desktop" view="settimana-vuota" hint-size="1280px,800px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:1280px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Desktop · vista Mese con elenco del giorno</figcaption><dc-import name="S1 Oggi Desktop" view="mese" hint-size="1280px,800px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:1280px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Desktop · mese senza attività</figcaption><dc-import name="S1 Oggi Desktop" view="mese-vuoto" hint-size="1280px,800px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:1280px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Desktop · trascinamento</figcaption><dc-import name="S1 Oggi Desktop" drag="lift" hint-size="1280px,800px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · Giorno vuoto · nessuna attività (Crea attività, Vai ai corsi)</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" variant="empty" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · Concluso · evento con orario passato, la card non scatta a hero</figcaption><dc-import name="S1 Oggi Mobile" intro="{{ false }}" now="passato" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:1280px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Desktop · Sessione in corso nella barra laterale (D4, D6)</figcaption><dc-import name="S1 Oggi Desktop" session="{{ true }}" hint-size="1280px,800px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:1280px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Desktop · card Adesso · evento con «Completa evento»</figcaption><dc-import name="S1 Oggi Desktop" now-kind="event" hint-size="1280px,800px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:1280px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Desktop · riordino con il mouse: frecce su e giù a destra del todo senza orario, solo nella stessa priorità</figcaption><dc-import name="S1 Oggi Desktop" move="hover" hint-size="1280px,800px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:1280px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Desktop · riordino da tastiera: Tab sulle frecce, fuoco visibile su «Sposta giù»</figcaption><dc-import name="S1 Oggi Desktop" move="focus" hint-size="1280px,800px"></dc-import></figure>
  </div>
</section>
