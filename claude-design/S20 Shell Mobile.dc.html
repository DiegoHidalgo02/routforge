<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0D13;color:#fff;--font-ui:'Manrope',system-ui,sans-serif;--font-num:'IBM Plex Mono',ui-monospace,monospace;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:#fff;text-decoration:none}a:hover{color:#6E96F2}
::-webkit-scrollbar{display:none}
</style>
</helmet>
<div data-screen-label="Statistiche · Notifiche · Impostazioni (mobile)" style="width:390px;height:844px;background:#0A0D13;border:1px solid #292E37;border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-sizing:border-box">
  <div style="height:16px;flex:none"></div>
  <div style="flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding:4px 16px 110px;display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;align-items:center;gap:12px">
      <sc-if value="{{ hasBack }}" hint-placeholder-val="{{ false }}"><button aria-label="Indietro" onClick="{{ goBack }}" style="width:40px;height:40px;margin-left:-8px;border-radius:999px;background:transparent;border:0;color:#959CA8;display:grid;place-items:center;cursor:pointer;padding:0;flex:none" style-hover="background:#1E232C;color:#fff"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" style="stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="m15 18-6-6 6-6"></path></svg></button></sc-if>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="display:flex;align-items:center;gap:8px;min-width:0;font:600 20px/24px var(--font-ui);letter-spacing:-.01em"><span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ title }}</span><sc-if value="{{ hasCount }}" hint-placeholder-val="{{ false }}"><span style="flex:none;height:20px;min-width:20px;padding:0 6px;border-radius:999px;background:#1C2439;color:#6E96F2;font:600 11px/20px var(--font-num);text-align:center">{{ count }}</span></sc-if></span><sc-if value="{{ hasSubtitle }}" hint-placeholder-val="{{ true }}"><span style="font:12px/16px var(--font-ui);color:#959CA8">{{ subtitle }}</span></sc-if></div>
      <sc-if value="{{ isNotif }}" hint-placeholder-val="{{ false }}"><button style="height:32px;padding:0 12px;border-radius:999px;background:transparent;border:1px solid #292E37;color:#fff;font:500 12px var(--font-ui);cursor:pointer;flex:none" style-hover="background:#1E232C">Segna tutte lette</button></sc-if>
    </div>
    <sc-if value="{{ hasSession }}" hint-placeholder-val="{{ false }}"><div data-screen-label="SessionShell banner" style="position:sticky;top:0;z-index:5;margin-top:-8px;height:44px;border-radius:12px;background:#1C2439;border:1px solid #1F3050;display:flex;align-items:center;gap:10px;padding:0 6px 0 12px;box-sizing:border-box;box-shadow:0 8px 24px rgba(0,0,0,.35);flex:none"><span style="width:8px;height:8px;border-radius:999px;background:#6E96F2;flex:none;box-shadow:0 0 8px 2px rgba(110,150,242,.7)"></span><span style="flex:1;min-width:0;font:500 13px var(--font-ui);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Sessione in corso · <span style="font:600 13px var(--font-num)">12:41</span> · Event loop visualizzato</span><button style="height:32px;padding:0 12px;border-radius:9px;background:transparent;border:0;color:#fff;font:600 13px var(--font-ui);cursor:pointer" style-hover="background:#243A60">Riprendi</button></div></sc-if>
    <sc-if value="{{ isStats }}" hint-placeholder-val="{{ true }}"><dc-import name="S20 Statistiche Panel" tab="{{ tab }}" period="{{ period }}" empty="{{ empty }}" hint-size="100%,700px"></dc-import></sc-if>
    <sc-if value="{{ isNotif }}" hint-placeholder-val="{{ false }}"><dc-import name="S21 Notifiche Panel" view="{{ view }}" hint-size="100%,700px"></dc-import></sc-if>
    <sc-if value="{{ isSettings }}" hint-placeholder-val="{{ false }}"><dc-import name="S22 Impostazioni Panel" view="{{ view }}" hint-size="100%,700px"></dc-import></sc-if>
  </div>
  <sc-if value="{{ showNav }}" hint-placeholder-val="{{ true }}">
  <nav style="position:absolute;left:50%;transform:translateX(-50%);width:264px;bottom:25px;height:56px;border-radius:999px;background:linear-gradient(180deg,#1A1F29,#111520);border:1px solid #2E343E;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 4px rgba(0,0,0,.4),0 14px 34px -6px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.6);display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;z-index:4;box-sizing:border-box">
    <a href="S1%20Oggi%20Mobile.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:5px;color:#959CA8;font:500 10px/12px var(--font-ui)" style-hover="color:#fff"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" style="stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>Oggi</a>
    <button aria-label="Crea" onClick="{{ goCreate }}" style="width:44px;height:44px;border-radius:999px;background:#6E96F2;border:0;color:#0A0D13;display:grid;place-items:center;margin:0 auto;cursor:pointer;padding:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 1px rgba(0,0,0,.35),0 6px 16px -8px rgba(0,0,0,.6)" style-hover="background:#8AAAF6"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" style="stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12h14M12 5v14"></path></svg></button>
    <a href="S20%20Shell%20Mobile.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:5px;color:{{ statsColor }};font:500 10px/12px var(--font-ui)" style-hover="color:#fff"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" style="stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="M3 3v18h18"></path><path d="M18 17V9M13 17V5M8 17v-3"></path></svg>Statistiche</a>
  </nav>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;stats&quot;,&quot;options&quot;:[&quot;stats&quot;,&quot;notif&quot;,&quot;settings&quot;],&quot;tsType&quot;:&quot;'stats' | 'notif' | 'settings'&quot;,&quot;section&quot;:&quot;Schermata&quot;},&quot;tab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;overview&quot;,&quot;options&quot;:[&quot;overview&quot;,&quot;behaviors&quot;,&quot;study&quot;,&quot;practice&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Statistiche&quot;},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;list&quot;,&quot;options&quot;:[&quot;list&quot;,&quot;empty&quot;,&quot;root&quot;,&quot;notifications&quot;,&quot;account&quot;,&quot;account-conflict&quot;,&quot;login&quot;,&quot;login-code&quot;,&quot;ai&quot;,&quot;ai-nokey&quot;,&quot;backup&quot;,&quot;diagnostics&quot;,&quot;notifications-denied&quot;,&quot;account-offline&quot;,&quot;account-erase&quot;,&quot;backup-export&quot;,&quot;backup-erase&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Notifiche / Impostazioni&quot;},&quot;period&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;90&quot;,&quot;options&quot;:[&quot;7&quot;,&quot;30&quot;,&quot;90&quot;,&quot;all&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Statistiche&quot;},&quot;empty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Statistiche&quot;},&quot;session&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sessione in corso (banner)&quot;}}">
class Component extends DCLogic {
  // Prototipo: i parametri dell'indirizzo (?view=…) valgono come prop quando la tavola non le passa
  pp() { const o = {}; Object.keys(this.props).forEach(k => { const v = this.props[k]; if (v !== undefined && v !== null && v !== '') o[k] = v; }); try { new URLSearchParams(window.location.search).forEach((v, k) => { o[k] = v; }); } catch (_) {} return o; }
  renderVals() {
    const pp = this.pp();
    const sc = pp.screen || 'stats', view = pp.view || 'list', tab = pp.tab || 'overview';
    const isStats = sc === 'stats', isNotif = sc === 'notif', isSettings = sc === 'settings';
    const settingsTitles = { root: ['Impostazioni', 'Alex'], notifications: ['Notifiche', 'Impostazioni'], account: ['Account e sincronizzazione', 'Impostazioni'], login: ['Accedi', 'Impostazioni'], ai: ['Modello e chiave AI', 'Impostazioni'], backup: ['Backup e dati', 'Impostazioni'], diagnostics: ['Diagnostica', 'Impostazioni'] };
    const st = settingsTitles[view.split('-')[0]] || settingsTitles.root;
    return { goCreate: () => { window.location.href = 'S4%20Crea%20Mobile.dc.html?filled=false'; }, goBack: () => { window.location.href = 'S1%20Oggi%20Mobile.dc.html'; },
      isStats, isNotif, isSettings, tab, view, period: pp.period || '90', empty: pp.empty === true || pp.empty === 'true', hasSession: pp.session === true || pp.session === 'true',
      title: isStats ? 'Statistiche' : isNotif ? 'Notifiche' : st[0],
      // Notifiche: nessun sottotitolo. Il numero di esiti pendenti sta nel contatore accanto al titolo (e nell'intestazione del gruppo dentro il pannello).
      // Statistiche e Notifiche: nessun sottotitolo — periodo e conteggi stanno nei controlli e nei gruppi
      subtitle: isStats || isNotif ? '' : st[1],
      hasSubtitle: !isNotif && !isStats, hasCount: isNotif && view !== 'empty', count: '3',
      hasBack: isSettings || isNotif, showNav: (!isSettings && !isNotif) || view === 'root', hasBadge: !(isNotif && view === 'empty'),
      statsColor: isStats ? '#fff' : '#959CA8', notifColor: isNotif ? '#fff' : '#959CA8'
    };
  }
}
</script>
</body>
</html>
