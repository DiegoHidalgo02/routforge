<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0D13;color:#fff;--font-ui:'Manrope',system-ui,sans-serif;--font-num:'IBM Plex Mono',ui-monospace,monospace;font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:#fff;text-decoration:none}a:hover{color:#8AAAF6}
</style>
</helmet>
<section data-screen-label="Notifiche · esiti da registrare" style="padding:40px;display:flex;flex-direction:column;gap:24px">
  <header style="display:flex;flex-direction:column;gap:8px;max-width:820px">
    <span style="font:600 11px/1 var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:#959CA8">RoutForge · FUNZIONALITA §19 · §7 promemoria e sveglie · MECCANISMI §13</span>
    <h1 style="margin:0;font:600 28px/1.2 var(--font-ui)">Notifiche · esiti da registrare</h1>
  </header>
  <div style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start">
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · esiti pendenti</figcaption><dc-import name="S20 Shell Mobile" screen="notif" view="list" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · tutto in ordine</figcaption><dc-import name="S20 Shell Mobile" screen="notif" view="empty" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:1280px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Desktop</figcaption><dc-import name="S20 Shell Desktop" screen="notif" hint-size="1280px,800px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · sveglia · routine di studio (Inizia · Posticipa)</figcaption><dc-import name="S8 Sveglia Mobile" kind="studio" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · sveglia · todo con orario (Segna fatto · Posticipa)</figcaption><dc-import name="S8 Sveglia Mobile" kind="todo" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Mobile · sveglia · routine (Apri il blocco)</figcaption><dc-import name="S8 Sveglia Mobile" kind="routine" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Notifiche di sistema · blocco di studio non avviato: pre, inizio, verifica, esito, perso (F1, B7, C6)</figcaption><dc-import name="S9 Notifiche di sistema Mobile" group="studio" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Notifiche di sistema · todo: digest, anticipo, scadenza, in ritardo, non fatto (A1, A2, A4, F3)</figcaption><dc-import name="S9 Notifiche di sistema Mobile" group="todo" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Notifiche di sistema · routine ed eventi, routine persa (F5, E3)</figcaption><dc-import name="S9 Notifiche di sistema Mobile" group="routine" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Notifiche di sistema · sessione: persistente Android, tempo scaduto, prova (D1, D4, §7.6)</figcaption><dc-import name="S9 Notifiche di sistema Mobile" group="sessione" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:390px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Sveglia · evento all’inizio (F2)</figcaption><dc-import name="S8 Sveglia Mobile" kind="evento" hint-size="390px,844px"></dc-import></figure>
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px;width:1280px"><figcaption style="font:13px var(--font-ui);color:#959CA8">Desktop · nessun esito da registrare</figcaption><dc-import name="S20 Shell Desktop" screen="notif" view="empty" hint-size="1280px,800px"></dc-import></figure>
  </div>
</section>
</x-dc>
</body>
</html>
